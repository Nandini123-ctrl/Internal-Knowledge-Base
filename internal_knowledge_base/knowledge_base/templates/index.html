{% extends 'base.html' %}

{% block content %}
<section>
    <h2>How can we help you today?</h2>
    <form action="/" method="GET" style="display: flex; gap: 10px;">
        <input type="search" name="search" placeholder="Search policies, Wi-Fi, HR guidelines..." value="{{ search_query }}">
        <button type="submit" style="width: auto;">Search</button>
    </form>
</section>

<hr>

<section>
    <h3>All Documents</h3>
    {% if articles %}
        <ul>
            {% for article in articles %}
                <li style="margin-bottom: 1.5rem; list-style: none;">
                    <span class="category-badge">{{ article.category }}</span> 
                    <a href="/article/{{ article.id }}" style="font-size: 1.2rem; font-weight: bold; margin-left: 10px;">
                        {{ article.title }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No articles found matching your search.</p>
    {% endif %}
</section>
{% endblock %}
