<!DOCTYPE html>
<html>
<head>
    <title>StealthAudit | Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .audit-card { 
            background: white; border: none; border-radius: 12px; 
            transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .audit-card:hover { transform: translateY(-5px); }
        .status-badge { border-radius: 20px; padding: 5px 12px; font-size: 0.8rem; }
        .hero-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px; }
    </style>
</head>
<body class="p-4">
    <div class="container" style="max-width: 800px;">
        <div class="hero-section p-5 mb-4 shadow text-center">
            <h2 class="display-6 fw-bold">🚀 StealthAudit Intelligence</h2>
            <p class="opacity-75">Bootstrapped Data Auditing for Modern Business</p>
            
            <div class="input-group mt-4 mx-auto" style="max-width: 500px;">
                <input type="file" id="formFile" class="form-control">
                <button onclick="startAudit()" class="btn btn-dark">Analyze File</button>
            </div>
        </div>

        <div id="resultBox" style="display:none;">
            <div class="row g-3" id="cardArea"></div>
        </div>
    </div>

    <script>
    function startAudit() {
        let fileInput = document.getElementById('formFile');
        let file = fileInput.files[0];
        if (!file) return alert("Please select a file first!");

        let formData = new FormData();
        formData.append('file', file);

        // Fixed the missing quote here
        fetch('https://stale-snakes-try.loca.lt/run-audit', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('resultBox').style.display = 'block';
            let cardArea = document.getElementById('cardArea');
            cardArea.innerHTML = ''; 

            data.rows.forEach(row => {
                // Fixed logic to check for missing values
                let isMissing = Object.values(row).some(v => v === "N/A" || v === "MISSING");
                let statusClass = isMissing ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success';
                let statusIcon = isMissing ? '❌' : '✅';
                let rowData = Object.values(row).join(" | ");

                cardArea.innerHTML += `
                    <div class="col-md-6">
                        <div class="audit-card p-3 mb-2 d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1 text-dark text-truncate" style="max-width: 250px;">${rowData}</h6>
                                <small class="text-muted">Row Audit Complete</small>
                            </div>
                            <span class="status-badge ${statusClass}">${statusIcon} ${isMissing ? 'Action Required' : 'Verified'}</span>
                        </div>
                    </div>
                `;
            });
        })
        .catch(err => alert("Connection Error. Check your link!"));
    }
    </script>
</body>
</html>
