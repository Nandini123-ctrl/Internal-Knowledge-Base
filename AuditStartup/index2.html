<!DOCTYPE html>
<html>
<head>
    <title>StealthAudit | Intelligence Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .hero-section { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; border-radius: 15px; }
        .audit-card { background: white; border-radius: 12px; border: none; margin-bottom: 15px; }
        .status-badge { border-radius: 20px; padding: 5px 12px; font-size: 0.75rem; font-weight: bold; }
    </style>
</head>
<body class="p-4">
    <div class="container" style="max-width: 900px;">
        <div class="hero-section p-5 mb-4 text-center shadow">
            <h2 class="fw-bold">StealthAudit Intelligence</h2>
            <div class="input-group mt-4 mx-auto" style="max-width: 650px;">
                <input type="file" id="auditInput" class="form-control">
                <button onclick="runAudit()" class="btn btn-dark">Analyze File</button>
                <button onclick="window.print()" class="btn btn-success">Download PDF</button>
                <button onclick="location.reload()" class="btn btn-outline-light">Reset</button>
            </div>
        </div>

        <div id="resultBox" style="display: none;">
            <div id="summaryBar" class="row g-3 mb-4 text-center"></div>
            <div class="row g-3" id="cardArea"></div>
        </div>
    </div>

    <script>
        async function runAudit() {
            const fileInput = document.getElementById('auditInput');
            if (!fileInput.files[0]) return alert("Please select a file first!");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('http://127.0.0.1:5000/run-audit', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error("Server error");
                
                const data = await response.json();
                
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('summaryBar').innerHTML = `
                    <div class="col-md-3"><div class="p-3 bg-white rounded shadow-sm">Total: ${data.total_items}</div></div>
                    <div class="col-md-3"><div class="p-3 bg-white rounded shadow-sm">Missing: ${data.missing_data}</div></div>
                    <div class="col-md-3"><div class="p-3 bg-white rounded shadow-sm text-danger">Negatives: ${data.negatives}</div></div>
                    <div class="col-md-3"><div class="p-3 bg-white rounded shadow-sm">Duplicates: ${data.duplicates}</div></div>`;

                const cardArea = document.getElementById('cardArea');
                cardArea.innerHTML = "";
                data.rows.forEach(row => {
                    const statusClass = row.has_error ? 'bg-danger-subtle text-danger' : 'bg-success-subtle text-success';
                    const statusText = row.has_error ? '⚠️ Review' : '✅ Verified';
                    const { has_error, ...rest } = row;
                    const content = Object.values(rest).join(" | ");

                    cardArea.innerHTML += `
                        <div class="col-md-6">
                            <div class="audit-card p-3 d-flex justify-content-between align-items-center shadow-sm">
                                <div class="text-truncate" style="max-width: 70%;">${content}</div>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>`;
                });
            } catch (err) {
                alert("Connection Error! Please make sure your Python code is running in IDLE.");
            }
        }
    </script>
</body>
</html>
