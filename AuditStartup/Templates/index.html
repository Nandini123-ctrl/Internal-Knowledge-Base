<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthAudit | AI Data Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-section { background: #2c3e50; color: white; padding: 60px 0; border-bottom: 5px solid #18bc9c; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #18bc9c; border: none; }
        .btn-primary:hover { background-color: #128f76; }
    </style>
</head>
<body>

    <div class="hero-section text-center">
        <h1>🚀 StealthAudit Engine</h1>
        <p>BCA Graduate Specialized Data Auditing for Small Businesses</p>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3>Upload Data for AI Audit</h3>
                    <p class="text-muted">Currently supported: Excel, CSV, and Tally Exports.</p>
                    <hr>
                    <div class="mb-3">
                        <label for="formFile" class="form-label">Select Business File</label>
                        <input class="form-control" type="file" id="formFile">
                    </div>
                    <button class="btn btn-primary w-100" onclick="startAudit()">Run Audit Logic</button>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-4" id="resultBox" style="display:none;">
            <div class="col-md-8">
                <div class="card p-4 bg-light">
                    <h4 class="text-success">✔ Audit Complete</h4>
                    <div id="outputArea">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
          function startAudit() {
    // This tells the browser to ask Python for the real audit results
    fetch('/run-audit')
        .then(response => response.json())
        .then(data => {
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('outputArea').innerHTML = `
                <p><strong>Total Items Scanned:</strong> ${data.total_items}</p>
                <p><strong>Missing Data Points:</strong> ${data.missing_data}</p>
                <p class="text-danger"><strong>Inventory Errors:</strong> ${data.negative_errors}</p>
            `;
        });
}
    </script>
</body>
</html>
