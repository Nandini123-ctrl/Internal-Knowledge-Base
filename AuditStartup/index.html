<!DOCTYPE html>
<html>
<head>
    <title>StealthAudit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
    <div class="container border p-4 shadow bg-white" style="max-width: 600px; border-radius: 15px;">
        <h3 class="mb-4">🚀 StealthAudit Dashboard</h3>

        <div class="mb-3">
            <label class="form-label font-weight-bold">Upload Excel for Audit</label>
            <input type="file" id="formFile" class="form-control mb-3">
            <button onclick="startAudit()" class="btn btn-primary w-100">Run Full Audit</button>
        </div>

        <div id="resultBox" class="mt-4 p-3 border" style="display:none; border-radius: 10px; background-color: #fdfdfd;">
            <h5 class="text-success">✅ Audit Report</h5>
            <hr>
            <div id="summaryArea"></div>
            <div id="tableArea" class="mt-3" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
    function startAudit() {
        let fileInput = document.getElementById('formFile');
        let file = fileInput.files[0];
        if (!file) return alert("Please select a file first!");

        let formData = new FormData();
        formData.append('file', file);

        // !!! PASTE YOUR NEW LINK FROM COLAB HERE !!!
        fetch('https://full-peas-float.loca.lt/run-audit', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('resultBox').style.display = 'block';

            // Show simple summary text
            document.getElementById('summaryArea').innerHTML = `
                <p><strong>Total Rows:</strong> ${data.total_items}</p>
                <p><strong>Missing Values:</strong> ${data.missing_data}</p>
            `;

            // Build simple table without any colors or badges
            let tableHtml = `
                <table class="table table-bordered table-sm">
                    <thead class="table-dark"><tr><th>Row Content</th></tr></thead>
                    <tbody>
            `;

            data.rows.forEach(row => {
                // Joins row values with a simple separator
                let rowData = Object.values(row).join(" | ");
                tableHtml += `<tr><td>${rowData}</td></tr>`;
            });

            tableHtml += `</tbody></table>`;
            document.getElementById('tableArea').innerHTML = tableHtml;
        })
        .catch(err => alert("Connection Error. Update your link in index.html!"));
    }
    </script>
</body>
</html>
