<html>
<head>
  <title>Javascript Function with Default Parameter values</title>
</head>
 <body>
 <script>
    function sayHello(name = 'World') 
{
    return ` Hello ${name}! ` ;
}
document.write(sayHello( )); // Prints:Hello World!
document.write("<br>");
document.write(sayHello("Nandu")); // Prints:Hello Nandu!
 </script>
</body>
</html>
