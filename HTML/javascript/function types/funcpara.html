<html>
<head>
<title>Javascript define and call a function</title>
</head>
<body>
<script>
//Defining function
  function displaySum(num1,num2) {
  let total=num1+num2;
  document.write(total);
}

//Calling function
  displaySum(6,20); //Prints:26
  document.write("<br>"); 
  displaySum(5,17); //Prints:22 
</script>
</body>
</html>
