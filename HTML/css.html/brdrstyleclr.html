<html>
<head>
  <style>
    p.one{
    border-style:ridge;
    border-color:purple;
}

    p.two{
    border-style:double;
    border-color:orange;
}

    p.three{
    border-style:inset;
    border-color:green;
}

   </style>
</head>
<body>

<h2>The border color property</h2>
   <p>This property specifies the color of the four borders:</p>
   <p class="one">A ridge purple color.</p>
   <p class="two">A double orange color.</p>
   <p class="three">A inset green color.</p>
</body>
</html>
